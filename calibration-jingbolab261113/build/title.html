<!-- ============ 1. TITLE = THE MESSAGE ============ -->
<div class="slide slide-title" data-slide="t-title" data-rw="1280" data-rh="720" style="padding:40px 56px 30px;" data-notes="Hi everyone, I'm Xuan Liu from UC San Diego. Here is the whole talk in one picture. Math and coding got dramatically better because they have a closed loop: the model produces an answer, a verifier checks it, and the feedback goes back. Human and social simulation doesn't have that loop — an agent produces some behavior, and we just say it looks plausible. Our claim is that classic social science experiments can be the verifier for human behavior, and CoBRA is how we close that loop. Let me unpack this.">
