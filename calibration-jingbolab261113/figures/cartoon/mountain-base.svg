<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -50 1150 470" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="mt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FCBBB"/><stop offset="1" stop-color="#5BA898"/></linearGradient>
  </defs>
  <!-- back hills -->
  <path d="M0 400 Q160 300 300 340 T620 330 T1150 350 L1150 400 Z" fill="#E8F5F0"/>
  <!-- main mountain -->
  <path d="M90 400 L330 170 L380 196 L470 78 L520 92 L580 150 L640 128 L860 400 Z" fill="url(#mt)"/>
  <!-- snow cap -->
  <path d="M430 128 L470 78 L520 92 L548 120 L520 116 L500 132 L478 112 L456 134 Z" fill="#fff"/>
  <!-- dotted climb path -->
  <path d="M170 392 Q260 330 300 300 T380 230 T440 150 T468 96" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.9"/>
  <!-- ground -->
  <line x1="0" y1="400" x2="1150" y2="400" stroke="#d1d5db" stroke-width="3"/>
  <!-- flag -->
  <line x1="512" y1="90" x2="512" y2="6" stroke="#6b7280" stroke-width="4"/>
  <path d="M514 8 L650 8 L636 30 L650 52 L514 52 Z" fill="#4A8E7E"/>
  <text x="578" y="36" text-anchor="middle" font-family="Comic Neue, cursive" font-size="17" font-weight="800" fill="#fff">MATH &amp; CODE</text>
  <!-- summit robot (arms up) -->
  <g transform="translate(470,-38) scale(0.75)">
    <line x1="0" y1="2" x2="0" y2="20" stroke="#6b7280" stroke-width="5"/>
    <circle cx="0" cy="0" r="8" fill="#F4B740"/>
    <rect x="-36" y="20" width="72" height="56" rx="14" fill="#fff" stroke="#6b7280" stroke-width="4"/>
    <path d="M-20 46 q8 -8 16 0" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M6 46 q8 -8 16 0" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-16 60 q16 12 32 0" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="-28" y="80" width="56" height="62" rx="12" fill="#5BA898" stroke="#4A8E7E" stroke-width="3"/>
    <path d="M-28 92 L-56 58" stroke="#6b7280" stroke-width="8" stroke-linecap="round"/>
    <path d="M28 92 L54 58" stroke="#6b7280" stroke-width="8" stroke-linecap="round"/>
    <rect x="-20" y="142" width="12" height="14" fill="#6b7280"/><rect x="8" y="142" width="12" height="14" fill="#6b7280"/>
    <path d="M-12 80 L0 104 L12 80" fill="none" stroke="#E5484D" stroke-width="5"/>
    <circle cx="0" cy="114" r="15" fill="#FFCD00" stroke="#B8860B" stroke-width="3"/>
  </g>
  <!-- trophy held up in the left hand -->
  <g transform="translate(424,-26)">
    <path d="M-20 -22 h40 v10 q0 26 -20 30 q-20 -4 -20 -30 z" fill="#FFCD00" stroke="#B8860B" stroke-width="3"/>
    <path d="M-20 -16 q-16 0 -14 12 q2 10 16 10" fill="none" stroke="#B8860B" stroke-width="3"/>
    <path d="M20 -16 q16 0 14 12 q-2 10 -16 10" fill="none" stroke="#B8860B" stroke-width="3"/>
    <rect x="-5" y="18" width="10" height="10" fill="#B8860B"/>
    <rect x="-14" y="28" width="28" height="7" rx="2" fill="#B8860B"/>
    <text x="0" y="2" text-anchor="middle" font-family="Comic Neue, cursive" font-size="16" font-weight="800" fill="#8a6500">1</text>
  </g>
  <!-- sparkles -->
  <g fill="#FFCD00">
    <path d="M404 96 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
    <path d="M436 4 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
    <path d="M660 70 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z"/>
  </g>
  <!-- summit label -->
  <text x="390" y="44" text-anchor="end" font-family="Comic Neue, cursive" font-size="30" font-weight="800" fill="#4A8E7E">Gold medal at IMO &amp; ICPC<tspan font-size="16" dy="-12" fill="#6b7280"> [1]</tspan></text>
</svg>
